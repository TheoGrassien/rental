name: Java CI

on:
  # Pas de filtre paths ni branches sur pull_request : les contrôles requis
  # doivent être rapportés sur toutes les PR, sinon elles restent bloquées.
  pull_request:
  push:
    branches: [main, develop]
    paths:
      - 'apps/car-rental-service/**'
      - '.github/workflows/ci-car-rental.yml'
  workflow_dispatch:

# Moindre privilège par défaut ; seul le job image élève ses droits.
permissions:
  contents: read

# Une nouvelle exécution sur la même PR annule la précédente devenue obsolète.
# Sur main et develop, on laisse chaque push aller au bout.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVICE_DIR: apps/car-rental-service
  REGISTRY: ghcr.io

jobs:
  tests:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Run tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: ./gradlew test

      # Publié même en cas d'échec : c'est précisément là qu'on en a besoin.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            ${{ env.SERVICE_DIR }}/build/test-results/test/
            ${{ env.SERVICE_DIR }}/build/reports/tests/test/
          retention-days: 7

  quality:
    name: Java quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      # --continue : analyse main et test même si l'un des deux échoue.
      - name: Run Checkstyle
        working-directory: ${{ env.SERVICE_DIR }}
        run: ./gradlew --continue checkstyleMain checkstyleTest

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-checkstyle-reports
          path: ${{ env.SERVICE_DIR }}/build/reports/checkstyle/
          retention-days: 7

  image:
    name: Java Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [tests, quality]
    permissions:
      contents: read
      packages: write          # push vers GHCR, utilisé uniquement sur main
      security-events: write   # envoi du rapport Trivy, uniquement sur main
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action met le nom d'image en minuscules (exigé par Docker),
      # ce que github.repository ne garantit pas (ex. TheoGrassien/rental).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/car-rental-service
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Cache de couches dans le cache GitHub Actions : aucun droit
      # d'écriture sur le registre n'est nécessaire depuis une PR.
      - name: Build (and push on main)
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_DIR }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=car-rental-service
          cache-to: type=gha,scope=car-rental-service,mode=max

      - name: Scan Docker image with Trivy
        if: env.PUBLISH == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        if: env.PUBLISH == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-scan-car-rental
